{% extends "base.html" %}
{% block title %}회원가입 · 공모전 보드{% endblock %}

{% block content %}
<main class="auth-page">
  <div class="auth-box">
    <p class="eyebrow">카르텔 공모전 보드</p>
    <h1 class="auth-title">회원가입</h1>
    <p class="auth-sub">관리자에게 받은 초대 코드가 필요합니다.</p>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/register" class="auth-form">
      <label class="field">
        <span>초대 코드 <span class="required">*</span></span>
        <input type="text" name="invite_code" placeholder="초대 코드 입력" required autocomplete="off">
      </label>

      <div class="field-divider"></div>

      <div class="form-grid two-col">
        <label class="field">
          <span>활동명 <span class="required">*</span></span>
          <input type="text" name="activity_name" placeholder="보드에서 표시될 이름" required maxlength="16"
                 pattern="[A-Za-z0-9가-힣_\-.]+" title="영문·한글·숫자·_-. 만 사용 가능">
          <small class="field-hint">공개되는 이름 · 최대 16자</small>
        </label>
        <label class="field">
          <span>실명 <span class="required">*</span></span>
          <input type="text" name="real_name" placeholder="실제 이름" required maxlength="50">
          <small class="field-hint">관리자만 볼 수 있습니다</small>
        </label>
      </div>

      <div class="form-grid two-col">
        <label class="field">
          <span>학번</span>
          <input type="text" name="student_id" placeholder="학번" maxlength="20">
          <small class="field-hint">관리자만 볼 수 있습니다</small>
        </label>
        <label class="field">
          <span>전화번호</span>
          <input type="tel" name="phone" placeholder="010-0000-0000" maxlength="20">
          <small class="field-hint">관리자만 볼 수 있습니다</small>
        </label>
      </div>

      <label class="field">
        <span>비밀번호 <span class="required">*</span></span>
        <input type="password" name="password" placeholder="6자 이상" required minlength="6">
      </label>

      <label class="field">
        <span>한 줄 소개 <small>(선택)</small></span>
        <textarea name="bio" rows="2" placeholder="간단한 자기소개" maxlength="200"></textarea>
      </label>

      <button type="submit" class="btn btn-primary btn-full">가입하기</button>
    </form>

    <p class="auth-footer-link">이미 계정이 있으신가요? <a href="/member/login">로그인</a></p>
  </div>
</main>
{% endblock %}
